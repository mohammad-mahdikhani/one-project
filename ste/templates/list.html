<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لیست قیمت استی</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">لیست مصرف‌کننده</p>
      <h1>قیمت‌های استی</h1>
    </div>
    <a class="ghost" href="/">بازگشت به پلاگین</a>
  </header>
  <main>
    <section class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>کد</th><th>کالا</th><th>قیمت</th></tr>
          </thead>
          <tbody>
            {% for item in products %}
            <tr>
              <td class="mono">{{ item.sku or "—" }}</td>
              <td>{{ item.name }}</td>
              <td class="mono">{{ money(item.price) }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
